<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <div class="app-header">
      <div class="app-title">
        <h1>待辦事項</h1>
        <span id="todo-count" class="todo-count">0 項</span>
      </div>
      <button id="theme-toggle" class="theme-toggle" aria-label="切換深色/淺色主題">🌙</button>
    </div>

    <div class="progress-wrap" id="progress-wrap" aria-hidden="true">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <form id="todo-form" class="todo-form">
      <input
        id="todo-input"
        type="text"
        placeholder="輸入待辦事項..."
        aria-label="待辦事項內容"
        required
      />
      <button type="submit" aria-label="新增待辦事項">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新增
      </button>
    </form>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="empty-state" class="empty-state">✨ 沒有待辦事項，輕鬆一下吧！</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
